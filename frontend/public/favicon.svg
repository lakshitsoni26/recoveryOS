<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- YC Signature Orange Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7711" />
      <stop offset="100%" stop-color="#E55500" />
    </linearGradient>

    <!-- Specular Highlight for Depth -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for Lightning -->
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#CC4400" stroke-width="1.5" />
  
  <!-- Subtle Inner Specular Rim -->
  <rect x="3" y="3" width="58" height="28" rx="14" fill="url(#specularGrad)" />

  <!-- Dual Concentric Sonic Recovery Waves (Telephony + Circular Revenue) -->
  <path d="M 44 22 A 16 16 0 0 1 44 42" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45" />
  <path d="M 49 17 A 23 23 0 0 1 49 47" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.25" />

  <!-- Crisp Central Lightning Bolt -->
  <path
    d="M 33 11 L 18 32 H 30 L 25 53 L 45 28 H 32 Z"
    fill="#FFFFFF"
    filter="url(#boltShadow)"
    stroke="#FFFFFF"
    stroke-width="1"
    stroke-linejoin="round"
  />
</svg>