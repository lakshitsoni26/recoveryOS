name: RecoveryOS CI/CD Evaluation Suite

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test-and-build:
    name: 52-Test Benchmark & Fullstack Build
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚡ Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: ⚛️ Install & Build Frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧪 Run 52-Test Automated Evaluation Suite
      env:
        SARVAM_API_KEY: "sk_test_mock_for_ci_suite"
        RAZORPAY_KEY_ID: "rzp_test_mock_for_ci_suite"
        RAZORPAY_KEY_SECRET: "mock_secret_for_ci_suite"
      run: |
        PYTHONPATH=. python tests/e2e_runner.py
